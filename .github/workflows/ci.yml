name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.8"
          - os: ubuntu-latest  # Ubuntu 26.04 ships no Python 3.8 build for setup-python
            python: "3.8"
        include:
          - os: ubuntu-24.04
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/release.py --check
