<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferro &amp; Figli, bicycle repairs since 1962</title>
  <style>
    :root { --ink: oklch(22% 0.02 60); --paper: oklch(96% 0.01 80); --signal: oklch(62% 0.19 145); }
    body { font-family: "Alegreya Sans", "Gill Sans", sans-serif; background: var(--paper); color: var(--ink); }
    h1 { font-size: clamp(2.5rem, 8vw, 6rem); line-height: 0.95; }
    a { color: var(--signal); transition: color 120ms ease-out; }
    .hours { display: grid; grid-template-columns: 8ch 1fr; gap: 0.25rem 1rem; }
  </style>
</head>
<body>
  <header><h1>We fix the bike you already love.</h1></header>
  <img src="/workshop.jpg" alt="Gianni truing a wheel on the 1962 stand, Via Po">
  <section class="hours">
    <span>Mon</span><span>closed</span>
    <span>Tue–Sat</span><span>8:30 to 19:00</span>
  </section>
  <p>Bring it in before noon and it is usually ready the same evening. <a href="/prices">See what a service costs</a>.</p>
</body>
</html>
